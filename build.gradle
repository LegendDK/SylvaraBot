plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

import java.util.Properties

// --- LOGIKA AUTO-INCREMENT VERSION (major.minor.patch) ---
File propFile = file('gradle.properties')
Properties props = new Properties()

if (propFile.exists()) {
	props.load(new FileInputStream(propFile))
}

int major = props.getProperty("major", "1").toInteger()
int minor = props.getProperty("minor", "4").toInteger()
int patch = props.getProperty("patch", "0").toInteger()

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("build") || it.toLowerCase().contains("jar") }) {
	patch++
	if (patch > 9) {
		patch = 0
		minor++
		if (minor > 9) {
			minor = 0
			major++
		}
	}
	props.setProperty("major", major.toString())
	props.setProperty("minor", minor.toString())
	props.setProperty("patch", patch.toString())
	props.store(new FileOutputStream(propFile), "Auto-incremented build version (major.minor.patch)")
}

version = "${major}.${minor}.${patch}"
// -----------------------------------------------------------

repositories {
	// Add repositories to retrieve artifacts from in here.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sylvarabot" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def projVersion = project.version
	inputs.property "version", projVersion

	filesMatching("fabric.mod.json") {
		expand "version": projVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}